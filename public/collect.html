<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>Spot Memory スタンプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/collect.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter>
</svg>

<div id="loading" class="loading">読み込み中…</div>

<div id="error" class="errbox" hidden>
  <h1 id="errTitle"></h1><p id="errBody"></p><a class="btn" href="/">ラリー一覧へ</a>
</div>

<!-- Scene 1-3: 演出レイヤー -->
<div id="stage" class="layer" hidden>
  <div class="bg" id="bg"></div><div class="shade"></div>
  <div class="bar"><div class="brand"><span class="logo" aria-hidden="true"></span><span><b>Spot Memory</b><small class="rallyName"></small></span></div>
    <button id="skip" class="skip" type="button">スキップ</button></div>

  <section id="s1" class="scene center">
    <div id="glitter" class="glitter" aria-hidden="true"></div>
    <h1 class="msg">写真見つけて<br>ありがとう！</h1>
    <div class="underline"></div>
    <p class="msgsub">この場所の思い出に<br>出会ってくれてありがとう。</p>
  </section>

  <section id="s2" class="scene cardscene">
    <div class="head2"><div class="get">＼ スタンプをGET！ ／</div><div id="spotTitle" class="spotname"></div></div>
    <div class="panel">
      <div class="ctitle"><h2 id="cTitle"></h2><p id="cSub"></p></div>
      <div id="card3"></div>
    </div>
    <button id="next" class="btn big next" type="button">次へ</button>
  </section>
</div>

<!-- Scene 4: 通常ページ -->
<div id="page" class="wrap" hidden>
  <div class="bar2"><div class="brand"><span class="logo" aria-hidden="true"></span><span><b>Spot Memory</b><small class="rallyName"></small></span></div></div>
  <div id="hero" class="hero"></div>
  <main class="body">
    <h2 id="spotName" class="spotname dark"></h2>
    <p id="summary" class="summary"></p>
    <section class="gacha" aria-live="polite">
      <h3>このスポットの思い出</h3>
      <div id="gachaIdle">
        <p id="gachaLead">ここに残された思い出が、ひとつだけ見つかります。</p>
        <button id="gachaBtn" class="btn big" type="button">このスポットの思い出ガチャを引く</button>
      </div>
      <div id="gachaRun" class="capsule-box" hidden><div class="capsule" aria-hidden="true"></div><p>思い出を探しています…</p></div>
      <figure id="memory" class="memory" hidden><blockquote id="memBody"></blockquote><figcaption id="memAuthor"></figcaption></figure>
      <p id="gachaNote" class="gnote" hidden></p>
    </section>
    <button id="share" class="btn big" type="button">発見したスタンプと思い出をシェアする</button>
    <section class="cardsec"><h3>スタンプカード</h3><div id="card4"></div></section>
    <section class="appcard">
      <h3>スタンプを集めて、この土地に眠る思い出をもっと見つけよう。</h3>
      <p>スタンプを集めるには、アプリが必要です。<br>ほかのスポットのスタンプを集めたい。この土地に残された、ほかの人の思い出も読んでみたい。<br>そんなあなたに、Spot Memory。</p>
      <a id="dl" class="btn big" href="#">アプリをダウンロード</a>
    </section>
    <p class="foot">Spot Memory</p>
  </main>
</div>

<!-- シェア画像プレビュー -->
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="シェア画像">
  <div class="sheet-in">
    <div class="ratio" role="group" aria-label="画像の比率">
      <button type="button" data-r="1:1" class="on">1:1</button><button type="button" data-r="4:5">4:5</button>
    </div>
    <div class="prev"><img id="prevImg" alt="発見したスタンプと思い出のシェア画像"></div>
    <div class="acts">
      <button id="doShare" class="btn" type="button">画像をシェア</button>
      <button id="doSave" class="btn ghost" type="button">画像を保存</button>
    </div>
    <button id="closeSheet" class="close" type="button">閉じる</button>
  </div>
</div>

<script src="/assets/collect.js" type="module"></script>
</body>
</html>
